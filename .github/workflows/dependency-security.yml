name: Dependency Security

on:
  pull_request:
    paths:
      - "api/go.mod"
      - "api/go.sum"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "web/pnpm-workspace.yaml"
      - "web-spa/package.json"
      - "web-spa/pnpm-lock.yaml"
      - "web-spa/pnpm-workspace.yaml"
      - "osv-scanner.toml"
      - "scripts/dependency-security.sh"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  push:
    branches:
      - main
      - dev
      - dev-c
    paths:
      - "api/go.mod"
      - "api/go.sum"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "web/pnpm-workspace.yaml"
      - "web-spa/package.json"
      - "web-spa/pnpm-lock.yaml"
      - "web-spa/pnpm-workspace.yaml"
      - "osv-scanner.toml"
      - "scripts/dependency-security.sh"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: OSV lockfile scan and SBOM
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Export CycloneDX 1.5 SBOM
        run: bash scripts/dependency-security.sh sbom "${RUNNER_TEMP}/luas.cdx.json"

      - name: Scan dependency lockfiles
        run: bash scripts/dependency-security.sh scan

      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luas-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/luas.cdx.json
          if-no-files-found: error
          retention-days: 14

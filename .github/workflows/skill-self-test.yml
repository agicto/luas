name: Skill Self-Test

# Runs each skill's own validation script against every maintained starter
# module, including opt-in starters. This catches drift between what a skill
# prescribes and what the codebase actually does.
#
# A PR that breaks any starter module — or a skill change whose validator
# rejects working code — will fail here before it reaches main.

on:
  pull_request:
    paths:
      - 'api/**'
      - '.agents/skills/**'
      - 'api/.agents/skills/**'
      - '.github/workflows/skill-self-test.yml'
  push:
    branches:
      - main
      - dev
      - dev-c
    paths:
      - 'api/**'
      - '.agents/skills/**'
      - 'api/.agents/skills/**'
      - '.github/workflows/skill-self-test.yml'

permissions:
  contents: read

jobs:
  starter-modules:
    name: Starter Modules
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        module: [user, apikey, audit, organization, permission, notification, asset, setting, usage, webhook]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: module-creation self-test (${{ matrix.module }})
        run: bash .agents/skills/module-creation/scripts/validate-module.sh ${{ matrix.module }}

      - name: api-development self-test (${{ matrix.module }})
        run: bash .agents/skills/api-development/scripts/validate-api.sh ${{ matrix.module }}

      - name: database-design self-test (${{ matrix.module }})
        run: bash .agents/skills/database-design/scripts/validate-db.sh ${{ matrix.module }}

      - name: logging-standards self-test (${{ matrix.module }})
        run: bash .agents/skills/logging-standards/scripts/validate-logging.sh ${{ matrix.module }}

  skill-metadata:
    name: Skill Metadata
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate every SKILL.md against codex loader rules
        run: bash .agents/skills/scripts/validate-skill.sh --all

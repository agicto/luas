name: Skill Self-Test

# Runs each skill's own validation script against every maintained starter
# module, including opt-in starters. This catches drift between what a skill
# prescribes and what the codebase actually does.
#
# A PR that breaks any starter module — or a skill change whose validator
# rejects working code — will fail here before it reaches main.

on:
  pull_request:
    paths:
      - 'api/**'
      - '.agents/skills/**'
      - 'api/.agents/skills/**'
      - '.github/workflows/skill-self-test.yml'
  push:
    branches:
      - main
      - dev
      - dev-c
    paths:
      - 'api/**'
      - '.agents/skills/**'
      - 'api/.agents/skills/**'
      - '.github/workflows/skill-self-test.yml'

permissions:
  contents: read

jobs:
  starter-modules:
    name: Starter Modules
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        module: [user, apikey, audit, organization, permission, notification, asset]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Install only; the skill validator scripts own the lint invocation.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.48.0

      - name: coding-standards self-test (${{ matrix.module }})
        run: bash .agents/skills/coding-standards/scripts/verify-standards.sh ${{ matrix.module }}

      - name: api-development self-test (${{ matrix.module }})
        run: bash .agents/skills/api-development/scripts/validate-api.sh ${{ matrix.module }}

      - name: database-design self-test (${{ matrix.module }})
        run: bash .agents/skills/database-design/scripts/validate-db.sh ${{ matrix.module }}

      - name: logging-standards self-test (${{ matrix.module }})
        run: bash .agents/skills/logging-standards/scripts/validate-logging.sh ${{ matrix.module }}

  skill-metadata:
    name: Skill Metadata
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate every SKILL.md against codex loader rules
        run: bash .agents/skills/scripts/validate-skill.sh --all

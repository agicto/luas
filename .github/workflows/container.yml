name: Container

on:
  pull_request:
    paths:
      - "api/**"
      - "scripts/container-security.sh"
      - ".trivyignore.yaml"
      - ".agents/skills/luas-framework-review/scripts/check-container-supply-chain.py"
      - ".github/workflows/container.yml"
  push:
    branches:
      - main
      - dev
      - dev-c
    paths:
      - "api/**"
      - "scripts/container-security.sh"
      - ".trivyignore.yaml"
      - ".agents/skills/luas-framework-review/scripts/check-container-supply-chain.py"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and smoke test
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify production image contract
        env:
          BUILD_METADATA_OUTPUT: ${{ runner.temp }}/luas-api.build-metadata.json
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          OCI_REVISION: ${{ github.sha }}
          OCI_VERSION: ${{ github.sha }}
        run: bash scripts/verify-container.sh luas-api:ci

      - name: Export SBOM and scan production image
        run: bash ../scripts/container-security.sh verify luas-api:ci "${RUNNER_TEMP}/luas-api.cdx.json"

      - name: Upload API container evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luas-api-container-security-${{ github.sha }}
          path: |
            ${{ runner.temp }}/luas-api.build-metadata.json
            ${{ runner.temp }}/luas-api.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify local Compose lifecycle
        run: bash scripts/verify-compose.sh luas-api:ci

      - name: Verify typed setting Compose lifecycle
        env:
          OPTIONAL_STARTERS: organization,setting
        run: bash scripts/verify-compose.sh luas-api:ci

      - name: Verify usage metering Compose lifecycle
        env:
          OPTIONAL_STARTERS: organization,usage
        run: bash scripts/verify-compose.sh luas-api:ci

      - name: Verify webhook delivery Compose lifecycle
        env:
          OPTIONAL_STARTERS: organization,webhook
        run: bash scripts/verify-compose.sh luas-api:ci

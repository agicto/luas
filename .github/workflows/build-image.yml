name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy on zgo-vps
    runs-on: [self-hosted, zgo-vps]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            -t zgo-api:sha-$SHORT_SHA \
            -t zgo-api:latest \
            .

      - name: Compose up
        working-directory: deploy
        run: docker compose up -d

      - name: Wait for /health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8025/health >/dev/null 2>&1; then
              echo "zgo-api healthy after ${i} tries"
              exit 0
            fi
            sleep 1
          done
          echo "zgo-api did not become healthy; recent logs:"
          docker logs --tail 80 zgo-api || true
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f --filter "dangling=true" --filter "until=24h" || true

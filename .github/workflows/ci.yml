name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - dev-c

permissions:
  contents: read

jobs:
  governance:
    name: Governance
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Root governance guardrails
        run: make governance

  api:
    name: API
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Install golangci-lint as a binary; run-tiers.sh invokes it.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.12.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verification — Tier 1 (build + lint + test) on the whole api/ tree
        # The whole tree is now lint clean (golangci-lint run ./...). New
        # debt anywhere blocks CI here.
        run: bash ../.agents/skills/verification-before-completion/scripts/run-tiers.sh 1

      - name: Concurrency-critical queue lifecycle race tests
        run: make test-race-critical

  web:
    name: Web
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verification — Tier 2 (type-check + lint + test + build)
        run: bash ../.agents/skills/verification-before-completion/scripts/run-tiers.sh 2

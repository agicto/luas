name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - dev-c

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: api
          args: --version
          install-mode: binary

      - name: Verification — Tier 1 (build + lint + test) on starter modules and capabilities
        # Scoped to the clean trees; other subtrees (infra/, tools/, scripts/,
        # tests/) carry pre-existing lint debt tracked separately. Expanding
        # the scope here is a goal but requires that cleanup first.
        run: |
          bash ../.agents/skills/verification-before-completion/scripts/run-tiers.sh 1 \
            ./internal/modules/... \
            ./internal/capabilities/...

  web:
    name: Web
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verification — Tier 2 (type-check + lint + test + build)
        run: bash ../.agents/skills/verification-before-completion/scripts/run-tiers.sh 2

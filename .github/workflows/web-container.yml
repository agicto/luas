name: Web Container

on:
  pull_request:
    paths:
      - "web/**"
      - "scripts/container-security.sh"
      - "scripts/validate-container-sbom.py"
      - ".trivyignore.yaml"
      - ".agents/skills/luas-framework-review/scripts/check-container-supply-chain.py"
      - ".github/workflows/web-container.yml"
  push:
    branches:
      - main
      - dev
      - dev-c
    paths:
      - "web/**"
      - "scripts/container-security.sh"
      - "scripts/validate-container-sbom.py"
      - ".trivyignore.yaml"
      - ".agents/skills/luas-framework-review/scripts/check-container-supply-chain.py"
      - ".github/workflows/web-container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, smoke test, and scan
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify production image contract
        env:
          BUILD_METADATA_OUTPUT: ${{ runner.temp }}/luas-web.build-metadata.json
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          OCI_REVISION: ${{ github.sha }}
          OCI_VERSION: ${{ github.sha }}
        run: bash scripts/verify-container.sh luas-web:ci

      - name: Export SBOM and scan production image
        run: bash ../scripts/container-security.sh verify luas-web:ci "${RUNNER_TEMP}/luas-web.cdx.json"

      - name: Upload Web container evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luas-web-container-security-${{ github.sha }}
          path: |
            ${{ runner.temp }}/luas-web.build-metadata.json
            ${{ runner.temp }}/luas-web.cdx.json
          if-no-files-found: warn
          retention-days: 14

name: Plugins

# Compatibility matrix: every official plugin is installed into a copy of the checkout, integrated,
# built, tested on each half it touches, checked by plugin:doctor, and removed again
# (scripts/verify-plugin.sh). Runs when the registry or the plugin machinery changes, and nightly
# so a core change that breaks a plugin is caught even when no plugin file changed.
on:
  pull_request:
    paths:
      - registry/**
      - api/internal/infra/pluginregistry/**
      - api/internal/infra/projectfiles/**
      - contracts/scripts/**
      - scripts/verify-plugin.sh
      - .github/workflows/plugins.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  list:
    name: List plugins
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - id: list
        name: Read registry/index.json
        run: |
          echo "plugins=$(jq -c '[.plugins[] | select((.kind // "feature") != "template") | .name]' registry/index.json)" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.plugin }}
    needs: list
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.list.outputs.plugins) }}
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # 16.14-alpine3.24
        env:
          POSTGRES_DB: fastbuild_test
          POSTGRES_USER: fastbuild
          POSTGRES_PASSWORD: fastbuild_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fastbuild -d fastbuild_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: contracts/package.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install dependencies
        run: |
          for half in contracts web admin; do
            (cd "$half" && corepack pnpm install --frozen-lockfile)
          done

      - name: Verify the plugin end to end
        env:
          FASTBUILD_TEST_POSTGRES_DSN: postgres://fastbuild:fastbuild_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/fastbuild_test?sslmode=disable
        run: scripts/verify-plugin.sh "${{ matrix.plugin }}"

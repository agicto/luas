apiVersion: batch/v1
kind: Job
metadata:
  name: fastbuild-migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastbuild-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: fastbuild-api
          command: ["/app/fastbuild"]
          args: ["migrate", "--force"]
          envFrom:
            - configMapRef:
                name: fastbuild-api-config
            - secretRef:
                name: fastbuild-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

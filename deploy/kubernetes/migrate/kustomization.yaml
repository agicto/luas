# Pre-deploy migration job. Apply it, wait for completion, then roll out the base:
#   kubectl apply -k deploy/kubernetes/migrate && kubectl wait --for=condition=complete job/luas-migrate
# Jobs are immutable: delete the finished job (ttlSecondsAfterFinished does it for you) or use a
# per-release name before the next run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../config
  - job.yaml

images:
  - name: luas-api
    newName: registry.example.com/luas-api
    newTag: replace-with-a-digest

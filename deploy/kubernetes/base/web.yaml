# Customer Web application. NEXT_PUBLIC_* values are compiled into the image at build time; only
# server-side variables below are read at runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luas-web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: luas-web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: luas-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: luas-web
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_ADAPTER_ENABLED
              value: "true"
            - name: API_UPSTREAM_URL
              value: http://luas-api:8025/v1
            - name: API_CLIENT_IP_HEADER
              value: X-Real-IP
            - name: MOCK_BFF_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: luas-web
spec:
  selector:
    app.kubernetes.io/name: luas-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: luas-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: luas-web

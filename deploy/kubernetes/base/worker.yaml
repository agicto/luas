# Durable workflow tasks (QUEUE_DRIVER=postgres). Database leases make horizontal scaling safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastbuild-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: fastbuild-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastbuild-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: fastbuild-api
          command: ["/app/fastbuild"]
          args: ["workflow:work"]
          envFrom:
            - configMapRef:
                name: fastbuild-api-config
            - secretRef:
                name: fastbuild-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

# Local development stack only. Production deployments should inject their
# own secrets, origins, persistence, and rollout policy into the built image.
x-api-environment: &api-environment
  APP_ENV: development
  APP_DEBUG: "true"
  APP_URL: http://localhost:${LUAS_API_PORT:-8025}
  OPTIONAL_STARTERS: ${OPTIONAL_STARTERS:-}
  ORGANIZATION_INVITATION_TTL: ${ORGANIZATION_INVITATION_TTL:-168h}
  OBJECT_STORAGE_LOCAL_ROOT: /tmp/luas-objects
  OBJECT_STORAGE_REQUEST_TIMEOUT: ${OBJECT_STORAGE_REQUEST_TIMEOUT:-30s}
  ASSET_TRANSFER_SIGNING_KEY: ${ASSET_TRANSFER_SIGNING_KEY:-luas-local-only-asset-transfer-signing-key-0123456789}
  ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-10485760}
  ASSET_UPLOAD_GRANT_TTL: ${ASSET_UPLOAD_GRANT_TTL:-10m}
  ASSET_DOWNLOAD_GRANT_TTL: ${ASSET_DOWNLOAD_GRANT_TTL:-5m}
  ASSET_PENDING_TTL: ${ASSET_PENDING_TTL:-1h}
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-luas-local-only-webhook-encryption-key-0123456789}
  WEBHOOK_REQUEST_TIMEOUT: ${WEBHOOK_REQUEST_TIMEOUT:-15s}
  WEBHOOK_MAX_RESPONSE_BYTES: ${WEBHOOK_MAX_RESPONSE_BYTES:-65536}
  WEBHOOK_SECRET_OVERLAP: ${WEBHOOK_SECRET_OVERLAP:-24h}
  WEBHOOK_EVENT_RETENTION: ${WEBHOOK_EVENT_RETENTION:-720h}
  WEBHOOK_ALLOW_INSECURE_HTTP: ${WEBHOOK_ALLOW_INSECURE_HTTP:-true}
  WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-true}
  SERVER_MODE: release
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: 8025
  DB_ENABLED: "true"
  DB_DRIVER: postgres
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: luas
  DB_USERNAME: luas
  DB_PASSWORD: ${LUAS_DB_PASSWORD:-luas-local-only}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:3001}
  AI_ENABLED: "false"
  METRICS_ENABLED: "true"
  QUEUE_DRIVER: postgres
  LOG_LEVEL: debug
  LOG_JSON: "true"
  TZ: UTC

services:
  api:
    image: ${LUAS_API_IMAGE:-luas-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/luas", "serve", "--migrate"]
    ports:
      - "${LUAS_API_BIND_ADDRESS:-127.0.0.1}:${LUAS_API_PORT:-8025}:8025"
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: luas
      POSTGRES_USER: luas
      POSTGRES_PASSWORD: ${LUAS_DB_PASSWORD:-luas-local-only}
      TZ: UTC
    ports:
      - "${LUAS_DB_BIND_ADDRESS:-127.0.0.1}:${LUAS_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luas -d luas"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: ${LUAS_API_IMAGE:-luas-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/luas", "workflow:work"]
    environment: *api-environment
    depends_on:
      api:
        condition: service_healthy
    # The image health check probes HTTP; this worker probe verifies its runtime binary instead.
    healthcheck:
      test: ["CMD", "/app/luas", "version"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 30s

volumes:
  postgres-data:

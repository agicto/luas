version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - exhaustive
    - misspell
    - nilerr
    - unconvert
    - unparam
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - crypto/rand.Read
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - errcheck
        path: _test\.go
      - linters:
          - bodyclose
          - errcheck
        path: tests/
      - linters:
          - godox
        source: TODO
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/zgiai/luas/api
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

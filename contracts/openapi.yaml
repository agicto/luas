            Cache-Control:
              description: Operator responses are never cached.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorManagedUserResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorForbidden'
        '404':
          $ref: '#/components/responses/OperatorUserNotFound'
        '409':
          $ref: '#/components/responses/OperatorTargetProtected'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/operator/users/{user_id}/sessions/revoke:
    post:
      operationId: revokeOperatorUserSessions
      summary: Revoke every active session of an account without changing its status
      tags:
        - Operator
      security:
        - operatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorUserID'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: All active sessions of the account are revoked.
          headers:
            Cache-Control:
              description: Operator responses are never cached.
              schema:
                type: string
                const: private, no-store
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorForbidden'
        '404':
          $ref: '#/components/responses/OperatorUserNotFound'
        '409':
          $ref: '#/components/responses/OperatorTargetProtected'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Opaque server-side session credential returned by the Luas login API.
    operatorSession:
      type: apiKey
      in: cookie
      name: __Host-luas_operator
      description: HttpOnly platform-operator session cookie issued by POST /v1/operator/session. The
        name is `luas_operator` outside production or `OPERATOR_SESSION_COOKIE_NAME` when configured.
        Unsafe methods also require an allowed `Origin` and the `X-CSRF-Token` header; see OPERATORS.md.
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Requested page size, capped by the API.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    APIKeyID:
      name: api_key_id
      in: path
      required: true
      description: Positive API key identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationContext:
      name: Organization-Id
      in: header
      required: true
      description: Active organization for organization-scoped routes; verified against membership.
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,15}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Entity tag of the version the caller read; required for optimistic concurrency.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token returned by the operator session endpoints.
      schema:
        type: string
        minLength: 1
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Organization identifier; resolved only through the caller's membership.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationMemberID:
      name: member_id
      in: path
      required: true
      description: Organization membership identifier, not the user's global ID.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OrganizationInvitationID:
      name: invitation_id
      in: path
      required: true
      description: Organization invitation identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    PermissionAccessRoleID:
      name: access_role_id
      in: path
      required: true
      description: Access role identifier within the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    NotificationID:
      name: notification_id
      in: path
      required: true
      description: Positive notification identifier owned by the caller.
      schema:
        $ref: '#/components/schemas/PositiveID'
    NotificationStatusFilter:
      name: status
      in: query
      description: Read-state filter.
      schema:
        type: string
        enum:
          - all
          - unread
        default: all
    AssetID:
      name: asset_id
      in: path
      required: true
      description: Lowercase canonical asset UUID owned by the caller.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    AssetStatusFilter:
      name: status
      in: query
      description: Lifecycle filter; deleted assets are never listed.
      schema:
        type: string
        enum:
          - all
          - pending
          - ready
          - rejected
        default: all
    AssetTransferToken:
      name: transfer_token
      in: path
      required: true
      description: Opaque, short-lived signed transfer token issued in a local-driver grant URL.
      schema:
        type: string
        minLength: 1
    SettingKey:
      name: setting_key
      in: path
      required: true
      description: Code-owned setting key for the route's scope, such as `localization.locale`.
      schema:
        type: string
        minLength: 1
    SettingIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Aggregate `"settings-<sha256>"` validator from a previous response; `*` and weak forms
        also match.
      schema:
        type: string
    WebhookEndpointID:
      name: webhook_endpoint_id
      in: path
      required: true
      description: Positive webhook endpoint identifier in the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryID:
      name: webhook_delivery_id
      in: path
      required: true
      description: Positive webhook delivery identifier in the active organization.
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryEndpointFilter:
      name: endpoint_id
      in: query
      description: Only deliveries for this endpoint (canonical positive decimal).
      schema:
        $ref: '#/components/schemas/PositiveID'
    WebhookDeliveryStatusFilter:
      name: status
      in: query
      description: Only deliveries in this state.
      schema:
        $ref: '#/components/schemas/WebhookDeliveryStatus'
    WebhookTestIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one canonical key; a retry with the same key returns the originally queued
        delivery.
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,79}$
    OperatorOrigin:
      name: Origin
      in: header
      required: true
      description: Must exactly equal one of `OPERATOR_ALLOWED_ORIGINS`; otherwise 403 OPERATOR.ORIGIN_REJECTED.
      schema:
        type: string
        minLength: 1
    OperatorUserID:
      name: user_id
      in: path
      required: true
      description: Positive user identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorOrganizationID:
      name: organization_id
      in: path
      required: true
      description: Positive organization identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorWebhookDeliveryID:
      name: delivery_id
      in: path
      required: true
      description: Canonical positive decimal delivery identifier.
      schema:
        $ref: '#/components/schemas/PositiveID'
    OperatorSettingKey:
      name: setting_key
      in: path
      required: true
      description: Code-owned app-scope setting key, such as `branding.display_name`.
      schema:
        type: string
        minLength: 1
  responses:
    Forbidden:
      description: The caller is authenticated but not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: The `If-Match` version is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: The operation requires an `If-Match` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests; `Retry-After` is set when the reset time is known.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: The resource existed but has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidInput:
      description: The request body or semantic input is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    APIKeyNotFound:
      description: The API key is missing or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: The request body exceeded the configured limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: One or more request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    ServiceUnavailable:
      description: Required persistence or another dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationInvalidCredentials:
      description: Unknown identifier, wrong password, or inactive account (`AUTH.INVALID_CREDENTIALS`);
        the cases are deliberately indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationAccountDisabled:
      description: The session belongs to a disabled account (`AUTH.ACCOUNT_DISABLED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrganizationContextInvalid:
      description: '`ORGANIZATION.CONTEXT_REQUIRED` when `Organization-Id` is absent, `ORGANIZATION.CONTEXT_INVALID`
        when it is malformed or repeated, or `COMMON.INVALID_INPUT` for malformed JSON or path IDs.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PermissionAccessRoleValidationFailed:
      description: Field validation failed (`COMMON.VALIDATION_FAILED` with `errors`), or a requested
        permission key is not in the code-owned catalog (`PERMISSION.UNKNOWN`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorResponse'
              - $ref: '#/components/schemas/ErrorResponse'
    NotificationInvalidInput:
      description: '`COMMON.INVALID_INPUT`: a semantically invalid filter or identifier (for example an
        unknown `status`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetConflict:
      description: '`ASSET.NOT_READY` when the lifecycle state forbids the operation, or `ASSET.IDEMPOTENCY_CONFLICT`
        when an idempotency key is reused with different metadata.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetUploadExpired:
      description: '`ASSET.UPLOAD_EXPIRED`: the pending upload lifetime elapsed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetTooLarge:
      description: '`ASSET.SIZE_EXCEEDED` when declared, transferred, or stored size violates the asset
        policy, or `COMMON.REQUEST_TOO_LARGE` when the global body limit rejects the request.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetUnprocessable:
      description: '`ASSET.INVALID_MEDIA_TYPE` for an unsupported or inconsistent name, media type, or
        content, or `COMMON.INVALID_INPUT` for other semantically invalid input.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingNotFound:
      description: '`SETTING.NOT_FOUND`: the key is unknown or belongs to another scope.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingInvalidValue:
      description: '`SETTING.INVALID_VALUE`: the value is null, not a supported scalar, violates the definition,
        or the body has unknown fields.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SettingInvalidRequest:
      description: '`COMMON.INVALID_INPUT`: malformed, weak, wildcard, or multiple `If-Match` validators,
        or malformed/trailing JSON.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UsageForbidden:
      description: '`PERMISSION.DENIED`: only organization owners and admins may read organization usage.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookForbidden:
      description: '`PERMISSION.DENIED`: only organization owners and admins may manage webhooks.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookEndpointNotFound:
      description: '`WEBHOOK.ENDPOINT_NOT_FOUND` for an endpoint outside the active organization, or `ORGANIZATION.NOT_FOUND`
        when the organization context cannot be resolved.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookEndpointVersionConflict:
      description: '`WEBHOOK.ENDPOINT_VERSION_CONFLICT`: the `If-Match` version is stale.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookUnprocessable:
      description: '`WEBHOOK.INVALID_EVENT_TYPE`, `WEBHOOK.INVALID_TARGET`, or `COMMON.INVALID_INPUT`
        (for example an empty or over-long name).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookTestConflict:
      description: '`WEBHOOK.REPLAY_NOT_ALLOWED` when the endpoint is disabled or not subscribed to `webhook.test`,
        or `WEBHOOK.IDEMPOTENCY_CONFLICT`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetNotFound:
      description: '`ASSET.NOT_FOUND` for an absent, deleted, or foreign asset; a non-UUID path also returns
        404.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AssetTransferNotFound:
      description: '`ASSET.NOT_FOUND`: the token is invalid, expired, for another operation, the asset
        is gone, or the local driver is not active.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WebhookDeliveryNotFound:
      description: '`WEBHOOK.DELIVERY_NOT_FOUND` for a delivery outside the active organization, or `ORGANIZATION.NOT_FOUND`
        when the organization context cannot be resolved.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorForbidden:
      description: '`AUTH.ACCOUNT_DISABLED`, `OPERATOR.FORBIDDEN` (no current operator grant), `OPERATOR.ORIGIN_REJECTED`,
        or `OPERATOR.CSRF_REJECTED` on unsafe methods.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSignInForbidden:
      description: '`OPERATOR.ORIGIN_REJECTED` when `Origin` is missing or not allowed, or `OPERATOR.FORBIDDEN`
        when valid credentials belong to an account without an operator grant.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSignOutRejected:
      description: '`OPERATOR.ORIGIN_REJECTED` or `OPERATOR.CSRF_REJECTED` when a session cookie is presented.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorInvalidCredentials:
      description: '`AUTH.INVALID_CREDENTIALS` for unknown, wrong, or disabled accounts.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorTargetProtected:
      description: '`OPERATOR.TARGET_PROTECTED`: the target account holds an operator grant, including
        the caller''s own.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorUserNotFound:
      description: '`USER.NOT_FOUND`, or `COMMON.NOT_FOUND` when the path ID is not all digits.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorOrganizationNotFound:
      description: '`ORGANIZATION.NOT_FOUND` for an unknown organization, `WEBHOOK.DELIVERY_NOT_FOUND`
        for a delivery outside the organization, or `COMMON.NOT_FOUND` when a constrained path ID is not
        all digits.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorInvalidIdentifier:
      description: '`COMMON.INVALID_INPUT` with HTTP 422 when the organization path ID is `0`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSettingNotFound:
      description: '`SETTING.NOT_FOUND`: the key is unknown or not app-scoped.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorSettingInvalidValue:
      description: '`SETTING.INVALID_VALUE`: unknown fields, `null`, or a value outside the definition
        schema.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperatorWebhookReplayNotAllowed:
      description: '`WEBHOOK.REPLAY_NOT_ALLOWED`: the delivery is not terminal, reached the replay limit,
        or its endpoint is not active.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PositiveID:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    ErrorCode:
      type: string
      description: Stable dotted code used for client behavior.
      enum:
        - COMMON.INTERNAL
        - COMMON.NOT_FOUND
        - COMMON.CONFLICT
        - COMMON.INVALID_INPUT
        - COMMON.VALIDATION_FAILED
        - COMMON.RATE_LIMITED
        - COMMON.REQUEST_TOO_LARGE
        - COMMON.TIMEOUT
        - COMMON.SERVICE_UNAVAILABLE
        - AUTH.UNAUTHORIZED
        - AUTH.FORBIDDEN
        - AUTH.INVALID_CREDENTIALS
        - AUTH.ACCOUNT_DISABLED
        - AUTH.PASSWORD_RESET_TOKEN_INVALID
        - AUTH.PASSWORD_RESET_TOKEN_EXPIRED
        - USER.NOT_FOUND
        - USER.EMAIL_ALREADY_EXISTS
        - USER.USERNAME_ALREADY_EXISTS
        - API_KEY.NOT_FOUND
        - API_KEY.INVALID
        - API_KEY.EXPIRED
        - API_KEY.REVOKED
        - ORGANIZATION.NOT_FOUND
        - ORGANIZATION.CONTEXT_REQUIRED
        - ORGANIZATION.CONTEXT_INVALID
        - ORGANIZATION.SLUG_ALREADY_EXISTS
        - ORGANIZATION.OWNERSHIP_TRANSFER_REQUIRED
        - ORGANIZATION.OWNERSHIP_TRANSFER_TARGET_INVALID
        - ORGANIZATION.MEMBERSHIP_EXIT_REQUIRED
        - ORGANIZATION.MEMBER_NOT_FOUND
        - ORGANIZATION.INVITATION.NOT_FOUND
        - ORGANIZATION.INVITATION.INVALID
        - ORGANIZATION.INVITATION.EXPIRED
        - ORGANIZATION.INVITATION.EMAIL_MISMATCH
        - ORGANIZATION.INVITATION.ALREADY_PENDING
        - ORGANIZATION.MEMBER_ALREADY_EXISTS
        - PERMISSION.DENIED
        - PERMISSION.UNKNOWN
        - PERMISSION.ROLE_NOT_FOUND
        - PERMISSION.ROLE_SLUG_ALREADY_EXISTS
        - ROLE.NOT_FOUND
        - NOTIFICATION.NOT_FOUND
        - NOTIFICATION.IDEMPOTENCY_CONFLICT
        - NOTIFICATION.INVALID_CHANNEL
        - ASSET.NOT_FOUND
        - ASSET.NOT_READY
        - ASSET.IDEMPOTENCY_CONFLICT
        - ASSET.CLEANUP_REQUIRED
        - ASSET.UPLOAD_EXPIRED
        - ASSET.SIZE_EXCEEDED
        - ASSET.INVALID_MEDIA_TYPE
        - SETTING.NOT_FOUND
        - SETTING.INVALID_VALUE
        - SETTING.VERSION_CONFLICT
        - SETTING.PRECONDITION_REQUIRED
        - USAGE.METRIC_NOT_FOUND
        - USAGE.INVALID_EVENT
        - USAGE.EVENT_OUTSIDE_WINDOW
        - USAGE.IDEMPOTENCY_CONFLICT
        - USAGE.QUOTA_EXCEEDED
        - USAGE.QUOTA_VERSION_CONFLICT
        - USAGE.PRECONDITION_REQUIRED
        - WEBHOOK.ENDPOINT_NOT_FOUND
        - WEBHOOK.DELIVERY_NOT_FOUND
        - WEBHOOK.INVALID_EVENT_TYPE
        - WEBHOOK.INVALID_TARGET
        - WEBHOOK.IDEMPOTENCY_CONFLICT
        - WEBHOOK.ENDPOINT_VERSION_CONFLICT
        - WEBHOOK.PRECONDITION_REQUIRED
        - WEBHOOK.REPLAY_NOT_ALLOWED
        - OPERATOR.FORBIDDEN
        - OPERATOR.ORIGIN_REJECTED
        - OPERATOR.CSRF_REJECTED
        - OPERATOR.TARGET_PROTECTED
    FieldErrors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - error_code
        - message
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        error:
          type: string
        request_id:
          type: string
          minLength: 1
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - error_code
        - message
        - errors
      properties:
        code:
          const: 422
        error_code:
          const: COMMON.VALIDATION_FAILED
        message:
          type: string
        errors:
          $ref: '#/components/schemas/FieldErrors'
        request_id:
          type: string
          minLength: 1
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - current_page
        - per_page
        - total
        - last_page
        - from
        - to
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
        from:
          type: integer
          minimum: 0
        to:
          type: integer
          minimum: 0
    PaginationLinks:
      type: object
      additionalProperties: false
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type: string
        last:
          type: string
        prev:
          type:
            - string
            - 'null'
        next:
          type:
            - string
            - 'null'
    APIKey:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - name
        - key_prefix
        - scopes
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PositiveID'
        user_id:
          $ref: '#/components/schemas/PositiveID'
        name:
          type: string
          minLength: 1
          maxLength: 100
        key_prefix:
          type: string
          pattern: ^luas_[a-z0-9_-]+$
        scopes:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: ^(?:\*|[a-z][a-z0-9_-]{0,31}:[a-z][a-z0-9_-]{0,31})$
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 65
        expires_at:
          type: string
          format: date-time
    CreateAPIKeyResult:
      type: object
      additionalProperties: false
      required:
        - api_key
        - plaintext_key
      properties:

  /v1/operator/session:
    post:
      operationId: signInOperator
      summary: Sign in a platform operator and set the operator session cookie
      description: Credentials are verified before the operator grant is checked, so a non-operator never
        receives a session. Shares the public login per-IP and per-account quotas.
      tags:
        - Operator
      security: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorSignInRequest'
      responses:
        '200':
          description: The operator and the session-bound CSRF token; the session credential is only in
            the cookie.
          headers:
            Cache-Control:
              description: Operator responses are never cached.
              schema:
                type: string
                const: private, no-store
            Set-Cookie:
              description: HttpOnly, SameSite=Strict, Path=/ operator session cookie with Max-Age set
                to the session lifetime; Secure in production or when every allowed origin is https.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSessionResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/OperatorInvalidCredentials'
        '403':
          $ref: '#/components/responses/OperatorSignInForbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: getOperatorSession
      summary: Get the signed-in operator and the CSRF token for unsafe requests
      tags:
        - Operator
      security:
        - operatorSession: []
      parameters: []
      responses:
        '200':
          description: The current operator and the session-bound CSRF token.
          headers:
            Cache-Control:
              description: Operator responses are never cached.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorForbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: signOutOperator
      summary: Revoke the operator session and expire the cookie
      description: Without a session cookie the call succeeds and only expires the cookie; `Origin` and
        `X-CSRF-Token` are checked only when a cookie is presented. An already expired or revoked session
        still signs out.
      tags:
        - Operator
      security:
        - operatorSession: []
        - {}
      parameters:
        - name: Origin
          in: header
          required: false
          description: Required when a session cookie is presented; must equal an allowed Admin Console
            origin.
          schema:
            type: string
            minLength: 1
        - name: X-CSRF-Token
          in: header
          required: false
          description: Required when a session cookie is presented; the session-bound CSRF token.
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: The session is revoked (or absent) and the cookie is expired.
          headers:
            Cache-Control:
              description: Operator responses are never cached.
              schema:
                type: string
                const: private, no-store
            Set-Cookie:
              description: Expires the operator session cookie (empty value, Max-Age<=0).
              schema:
                type: string
        '403':
          $ref: '#/components/responses/OperatorSignOutRejected'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

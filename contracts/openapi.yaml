  /v1/asset-transfers/{transfer_token}:
    put:
      operationId: uploadAssetTransfer
      summary: Upload bytes for a pending asset through a local-driver transfer token
      description: Only served when the local object-storage driver is active; the signed token is the
        credential, so no bearer session is used.
      tags:
        - Assets
      security: []
      parameters:
        - $ref: '#/components/parameters/AssetTransferToken'
      requestBody:
        required: true
        description: Raw object bytes. `Content-Type` must equal the declared `media_type` and `Content-Length`
          must equal `size_bytes` exactly.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Bytes stored in staging; call completion next.
          headers:
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
                const: private, no-store
        '404':
          $ref: '#/components/responses/AssetTransferNotFound'
        '409':
          description: '`ASSET.NOT_READY`: the asset is no longer pending or its upload lifetime elapsed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/AssetTooLarge'
        '422':
          description: '`ASSET.INVALID_MEDIA_TYPE`: the request `Content-Type` differs from the declared
            media type.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: downloadAssetTransfer
      summary: Download a ready asset through a local-driver transfer token
      description: Only served when the local object-storage driver is active; the signed token is the
        credential, so no bearer session is used.
      tags:
        - Assets
      security: []
      parameters:
        - $ref: '#/components/parameters/AssetTransferToken'
      responses:
        '200':
          description: Object bytes served as an attachment with the asset's media type as `Content-Type`.
          headers:
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
                const: private, no-store
            Content-Disposition:
              description: '`attachment` with the original file name.'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/AssetTransferNotFound'
        '409':
          description: '`ASSET.NOT_READY`: the asset is not ready or its stored object is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

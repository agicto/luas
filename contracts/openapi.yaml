openapi: 3.1.0
info:
  title: Luas HTTP API
  version: 0.1.0
  description: Machine-readable contracts for reviewed Luas HTTP surfaces. A path is authoritative only
    after it is included here. Markdown contracts continue to own semantic and security behavior that
    cannot be represented completely by OpenAPI.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Current Luas API origin
tags:
  - name: Health
    description: Process probes for load balancers and orchestrators. They return raw JSON, not the API
      envelope.
  - name: Authentication
    description: Server-side session sign-in, sign-out, registration, and password recovery.
  - name: Users
    description: Profile, password, and account lifecycle for the authenticated user.
  - name: Audit
    description: Audit history of the authenticated user's own API mutations.
  - name: API Keys
    description: User-owned API key lifecycle.
  - name: Organizations
    description: Optional organization starter; membership-scoped organizations, members, invitations,
      and active context.
  - name: Permissions
    description: Optional permission starter; organization-scoped access roles, permission catalog, and
      assignments.
  - name: Notifications
    description: User-scoped in-app notification center and channel preferences.
  - name: Assets
    description: User-owned upload intents, completion, download grants, and local transfers.
  - name: Settings
    description: Code-owned app, organization, and user settings with optimistic concurrency.
  - name: Usage
    description: Private current-period usage summaries.
  - name: Webhooks
    description: Organization-owned outbound webhook endpoints and delivery ledger.
  - name: Operator
    description: 'Platform-operator browser session and operator-only reads and commands for the Admin
      Console (optional `operator` starter). Every response sends `Cache-Control: private, no-store`.'
paths:
  /health:
    get:
      operationId: getHealth
      summary: Aggregate health of every registered dependency check
      tags:
        - Health
      security: []
      responses:
        '200':
          description: The process is up or degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: At least one dependency check is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe; succeeds while the process can serve requests
      tags:
        - Health
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe; fails while a required dependency is down
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Ready to receive traffic, possibly degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProbe'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProbe'
  /v1/health:
    get:
      operationId: getApiHealth
      summary: Check API liveness
      description: Returns a static body without the standard envelope and is exempt from the global rate
        limit.
      tags:
        - Health
      security: []
      responses:
        '200':
          description: The API process is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionHealth'
  /v1/login:
    post:
      operationId: login
      summary: Sign in and issue an opaque session credential
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationLoginRequest'
      responses:
        '200':
          description: A new server-side session and the signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationLoginResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/AuthenticationInvalidCredentials'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/logout:
    post:
      operationId: logout
      summary: Revoke the presented session
      tags:
        - Authentication
      security:
        - bearerSession: []
      responses:
        '200':
          description: The presented session is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationLogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthenticationAccountDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/password/reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: Returns the same success body whether or not the email belongs to an account.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationPasswordResetRequest'
      responses:
        '200':
          description: Generic acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMessageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Consume a reset token and set a new password
      description: A successful reset revokes every session of the account.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationPasswordResetConfirmRequest'
      responses:
        '200':
          description: The password was reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMessageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: The reset token is unknown or already used (`AUTH.PASSWORD_RESET_TOKEN_INVALID`)
            or expired (`AUTH.PASSWORD_RESET_TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          description: The token is blank after trimming whitespace (`COMMON.INVALID_INPUT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/register:
    post:
      operationId: registerUser
      summary: Register a new user account
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRegisterRequest'
      responses:
        '201':
          description: The created API user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUserResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '409':
          description: The username (`USER.USERNAME_ALREADY_EXISTS`) or email (`USER.EMAIL_ALREADY_EXISTS`)
            is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/users/account:
    delete:
      operationId: deleteUserAccount
      summary: Delete the authenticated user's account
      description: Deletion revokes every session of the account in the same transaction.
      tags:
        - Users
      security:
        - bearerSession: []
      responses:
        '204':
          description: The account was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthenticationAccountDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An active starter blocks deletion, e.g. `ORGANIZATION.OWNERSHIP_TRANSFER_REQUIRED`,
            `ORGANIZATION.MEMBERSHIP_EXIT_REQUIRED`, or `ASSET.CLEANUP_REQUIRED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/users/password:
    put:
      operationId: changeUserPassword
      summary: Change the authenticated user's password
      description: Success revokes every session of the account, including the presented one.
      tags:
        - Users
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChangePasswordRequest'
      responses:
        '200':
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMessageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: Authentication is missing or invalid (`AUTH.UNAUTHORIZED`) or `old_password` is
            wrong (`AUTH.INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/AuthenticationAccountDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/users/profile:
    get:
      operationId: getUserProfile
      summary: Get the authenticated user's profile
      tags:
        - Users
      security:
        - bearerSession: []
      responses:
        '200':
          description: The authenticated API user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthenticationAccountDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateUserProfile
      summary: Update the authenticated user's profile
      description: Empty or omitted fields leave the stored value unchanged.
      tags:
        - Users
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          description: The updated API user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationUserResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthenticationAccountDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/audit-logs:
    get:
      operationId: listAuditLogs
      summary: List the authenticated user's audit history
      description: Newest first; only records whose `user_id` is the caller.
      tags:
        - Audit
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: action
          in: query
          schema:
            type: string
            maxLength: 120
        - name: resource
          in: query
          schema:
            type: string
            maxLength: 180
        - name: method
          in: query
          schema:
            type: string
            maxLength: 10
        - name: request_id
          in: query
          schema:
            type: string
            maxLength: 80
        - name: status_code
          in: query
          schema:
            type: integer
            minimum: 100
            maximum: 599
      responses:
        '200':
          description: Paginated audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AuthenticationAccountDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys owned by the authenticated user
      tags:
        - API Keys
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated API key metadata without plaintext credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createApiKey
      summary: Create an API key for the authenticated user
      tags:
        - API Keys
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key metadata and the one-time plaintext credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/api-keys/{api_key_id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key owned by the authenticated user
      tags:
        - API Keys
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/APIKeyID'
      responses:
        '204':
          description: The API key is revoked or was already revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/APIKeyNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organization-context:
    get:
      operationId: getOrganizationContext
      summary: Verify and return the active organization context
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationContext'
      responses:
        '200':
          description: The verified membership for the selected organization.
          headers:
            Vary:
              description: Includes `Organization-Id`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationContextResponse'
        '400':
          $ref: '#/components/responses/OrganizationContextInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ORGANIZATION.NOT_FOUND` for absent organizations and non-members alike.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organization-invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      summary: Accept an invitation token and create the caller's membership
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationAcceptRequest'
      responses:
        '200':
          description: The joined organization membership view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`ORGANIZATION.INVITATION.EMAIL_MISMATCH`: the token belongs to a different account
            email.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ORGANIZATION.INVITATION.INVALID`: malformed, unknown, revoked, or consumed token.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`ORGANIZATION.MEMBER_ALREADY_EXISTS`.'
        '410':
          $ref: '#/components/responses/Gone'
          description: '`ORGANIZATION.INVITATION.EXPIRED`.'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations the authenticated user belongs to
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated organization membership views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createOrganization
      summary: Create an organization owned by the authenticated user
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
      responses:
        '201':
          description: The organization with the caller's `owner` membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`USER.NOT_FOUND`: the caller account was deleted before the membership was written.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`ORGANIZATION.SLUG_ALREADY_EXISTS`.'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}:
    get:
      operationId: getOrganization
      summary: Get one organization visible through the caller's membership
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Organization membership view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ORGANIZATION.NOT_FOUND` for absent organizations and non-members alike.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateOrganization
      summary: Rename an organization
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
      responses:
        '200':
          description: Updated organization membership view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`PERMISSION.DENIED`: only `owner` and `admin` may rename.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ORGANIZATION.NOT_FOUND` for absent organizations and non-members alike.'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/invitations:
    get:
      operationId: listOrganizationInvitations
      summary: List token-free invitation history
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated invitation views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationPageResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`PERMISSION.DENIED`: only `owner` and `admin` manage invitations.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ORGANIZATION.NOT_FOUND` for absent organizations and non-members alike.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createOrganizationInvitation
      summary: Invite an email address as admin or member
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationCreateRequest'
      responses:
        '201':
          description: The persisted invitation and the synchronous email send attempt status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationCreateResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`PERMISSION.DENIED`: only `owner` and `admin` manage invitations.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ORGANIZATION.NOT_FOUND` for absent organizations and non-members alike.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`ORGANIZATION.INVITATION.ALREADY_PENDING` or `ORGANIZATION.MEMBER_ALREADY_EXISTS`.'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/invitations/{invitation_id}:
    delete:
      operationId: revokeOrganizationInvitation
      summary: Revoke a pending invitation while keeping its history
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/OrganizationInvitationID'
      responses:
        '204':
          description: The invitation was revoked.
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`PERMISSION.DENIED`: only `owner` and `admin` manage invitations.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ORGANIZATION.NOT_FOUND`, or `ORGANIZATION.INVITATION.NOT_FOUND` when the invitation
            is absent or no longer pending (accepted, revoked, or expired).'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/members:
    get:
      operationId: listOrganizationMembers
      summary: List the PII-minimized member directory of an organization
      tags:
        - Organizations
      security:
        - bearerSession: []
      parameters:

version: '3.8'

services:
  luas-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luas-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: local-compose-session-secret-change-me-32-chars

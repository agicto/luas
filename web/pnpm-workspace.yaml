packages:
  - .

# Keep dependency resolution and execution policy in the workspace authority.
packageManagerStrictVersion: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
blockExoticSubdeps: true
strictDepBuilds: true

overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@humanfs/node@<0.16.8': 0.16.8
  'ajv@<6.14.0': 6.15.0
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'browserslist@<4.28.7': 4.28.7
  caniuse-lite: 1.0.30001800
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  'flatted@<=3.4.1': 3.4.2
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'minimatch@<3.1.4': 3.1.5
  'minimatch@>=9.0.0 <9.0.7': 9.0.7
  'picomatch@<2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.4
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'postcss@<8.5.23': 8.5.23
  'sharp@<0.35.4': 0.35.4
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'vite@>=7.0.0 <=7.3.4': 7.3.5

allowBuilds:
  '@parcel/watcher@2.5.1': true
  '@swc/core@1.15.5': true
  'esbuild@0.28.1': true
  'sharp@0.34.5': true
  'unrs-resolver@1.12.2': true
